  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- shaft frame -->
  <rect x="116" y="76" width="280" height="360" rx="18" fill="#3b4256" stroke="#5a6480" stroke-width="10"/>
